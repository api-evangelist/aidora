aid: aidora
name: Aidora
description: >-
  Aidora was an AI-native leave-of-absence management platform for HR teams, founded in 2023 in San
  Francisco by Rhiana Gademsky and Anant Agarwal. The product automated the highly regulated leave
  lifecycle — eligibility determination across federal FMLA plus state paid-family-and-medical-leave
  programs, compliance forms, documentation, return-to-work planning and payroll coordination —
  through a natural-language interaction model employees could use by voice or text. Aidora raised
  roughly $2.7M in seed funding from Team Ignite Ventures and Fractal Software. On 9 July 2026
  Paylocity acquired Aidora and folded its absence-management capabilities into the Paylocity HR
  platform; getaidora.com is now a single acquisition notice and the company no longer operates an
  independent product surface. Aidora never published a public developer portal, API reference or
  machine-readable contract.
